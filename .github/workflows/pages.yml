# Build the trainer and publish it on GitHub Pages.
#
# Every push to main runs the suites that need only Node (the three R-oracle
# suites need a local R installation and run on the author's machine), builds the
# single-file trainer as index.html, and deploys it. A failing suite stops the
# deploy, so students never get a build the tests rejected.
name: Publish trainer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: |
          set -e
          for suite in behaviour lessons pictures glossary people bundle i18n-coverage; do
            node "test/$suite.mjs"
          done
      - name: Build
        run: |
          mkdir -p _site
          node build.mjs --out _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
